name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check JavaScript
        run: node --check translate.js

      - name: Translation drift report (warning only)
        run: node tools/check-translations.js
        continue-on-error: true

      # Rapport seulement, jamais bloquant : le 2026-09-14 le simple
      # telechargement du binaire lychee a echoue (CDN GitHub, code 22) et a
      # fige la publication du site pendant 6 jours, sans qu'aucun lien n'ait
      # meme ete verifie. Un outil tiers indisponible ne doit pas pouvoir
      # empecher la mise en ligne. Meme traitement que le controle de
      # traduction ci-dessus.
      - name: Check internal links (warning only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --offline --root-dir "$GITHUB_WORKSPACE" "**/*.html"
          fail: true

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TOUS les generateurs tournent a chaque deploiement, dans cet ordre.
      #
      # Pourquoi : auparavant seul build-blog.js tournait ici. make-sport.js et
      # build-en.js n'etaient lances qu'a la main, parfois apres des semaines.
      # Entre-temps leurs fichiers de sortie recevaient des retouches directes
      # qu'un seul lancement effacait d'un coup — c'est ainsi que la photo du
      # triathlon et plusieurs corrections de la page sport ont disparu.
      # En les executant a chaque fois, un ecart ne peut plus s'accumuler en
      # silence : il se voit au deploiement suivant.
      #
      # L'ordre compte : la page sport d'abord, puis le blogue francais, puis
      # l'anglais qui en derive, puis le blogue a nouveau — la liste anglaise
      # lit les titres sur les pages anglaises, qui doivent exister avant.
      - name: Build sports page
        run: node tools/make-sport.js
      - name: Build blog (French)
        run: node tools/build-blog.js
      - name: Build English pages
        run: node tools/build-en.js
      - name: Rebuild blog listings (English titles)
        run: node tools/build-blog.js
      - name: Refresh llms-full.txt for AI crawlers
        run: node tools/build-llms-full.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
